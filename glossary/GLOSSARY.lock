   "I/III/502nd/101st",
   "I营/III营/第502伞降步兵团/第101空降师"
  ],
  "If your performance does not improve, we will be forced to retire you. The spy is badly wounded. Only time will tell if he will live.": [
   "If your performance does not improve, we will be forced to retire you. The spy is badly wounded. Only time will tell if he will live.",
   "四人混战",
   "如果你的表现没有改善，我们将不得不让你退役。间谍伤势严重。他能否活下来，只有时间才能说明。"
  ],
  "In this directory are added the movies for the game": [
   "In this directory are added the movies for the game",
   "哥特防线抉择：",
   "本目录中添加了游戏的影片"
  ],
  "Invasion Salerno PeG:WW2": [
   "Invasion Salerno PeG:WW2",
