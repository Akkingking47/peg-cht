  "Commander, to have come so far at such cost, and then to have failed is utterly galling. I have no doubt that you tried your best, but sadly, a try is not good enough.": [
   "Commander, to have come so far at such cost, and then to have failed is utterly galling. I have no doubt that you tried your best, but sadly, a try is not good enough.",
   "二战 1/2：突入波兰",
   "指挥官，付出如此代价走到这一步，却功败垂成，实在令人恼恨。我不怀疑你已经尽了全力，但遗憾的是，尽力还不够。"
  ],
  "Commander, you have delayed the enemy long enough to allow our evacuation at Dunkirk. We cannot afford to keep taking such losses. We expect much more from you.": [
   "Commander, you have delayed the enemy long enough to allow our evacuation at Dunkirk. We cannot afford to keep taking such losses. We expect much more from you.",
   "指挥官，你拖延敌人的时间已足以让我们在敦刻尔克(Dunkirk)完成撤离。我们承受不起继续遭受这样的损失。我们对你的期望要高得多。",
   "温泉关"
  ],
  "Commander, you have narrowly achieved your objectives.  Unfortunately, German forces have been able to withdraw in good order and regroup behind new defensive lines.  You are obviously suffering from combat stress and will be reassigned to oversee the construction of weather stations in Greenland.  Dismissed.": [
   "Commander, you have narrowly achieved your objectives.  Unfortunately, German forces have been able to withdraw in good order and regroup behind new defensive lines.  You are obviously suffering from combat stress and will be reassigned to oversee the construction of weather stations in Greenland.  Dismissed.",
   "托布鲁克",
   "指挥官，你勉强达成了目标。遗憾的是，德军得以秩序井然地撤走，并在新的防线后方重新集结。你显然患上了战斗应激，将被调去监督格陵兰(Greenland)气象站的建设。解散。"
  ],
  "Communism is no longer a threat for Western Europe thanks to you Commander.": [
   "Communism is no longer a threat for Western Europe thanks to you Commander.",
   "多亏了你，指挥官，共产主义对西欧(Western Europe)不再是威胁。",
   "温莎(Windsor)："
  ],
  "Comrade General You have failed miserably! You have shown no conditions whatsoever to command a big group of troops! You should come back to your basics! You should report to the 10 NKVD Infantry division to command an infantry platoon!": [
   "Comrade General You have failed miserably! You have shown no conditions whatsoever to command a big group of troops! You should come back to your basics! You should report to the 10 NKVD Infantry division to command an infantry platoon!",
   "列宁格勒43(Leningrad43)",
   "将军同志，你败得很惨！你完全没有表现出指挥大兵团的条件！你该回去补补基本功！你应当向内务人民委员部第10步兵师报到，去指挥一个步兵排！"
  ],
  "Comrade General the Zitadelle offensive has exhausted itself! The time has come to attack towards Orel and threaten the German positions from behind! You should take command and coordinate the operations.": [
   "Comrade General the Zitadelle offensive has exhausted itself! The time has come to attack towards Orel and threaten the German positions from behind! You should take command and coordinate the operations.",
   "将军同志，「堡垒」(Zitadelle)攻势已耗尽自身！现在该向奥廖尔(Orel)进攻，从背后威胁德军阵地了！你应当接过指挥权并协调这次作战。",
   "将军同志，「库尔斯克会战」(Zitadelle)已耗尽自身！现在该向奥廖尔(Orel)进攻，从背后威胁德军阵地了！你应当接过指挥权并协调这次作战。"
  ],
  "Comrade General you have achieved complete victory! The German are retreating towards the Dnepr river at full speed! We have them on the run!": [
   "Comrade General you have achieved complete victory! The German are retreating towards the Dnepr river at full speed! We have them on the run!",
   "将军同志，你取得了完全的胜利！德国人正全速向第聂伯河(Dnepr)撤退！我们把他们打跑了！",
   "阿杰达比亚(Agedabia) - 1945 年 12 月 23 日"
  ],
  "Comrade General you have failed to break the lines on the flanks of Sixth Army! We cannot expelled the Germans now! Vassiliev is very upset with your incompetence!": [
   "Comrade General you have failed to break the lines on the flanks of Sixth Army! We cannot expelled the Germans now! Vassiliev is very upset with your incompetence!",
   "亚眠 - 索姆河",
   "将军同志，你未能突破第6集团军两翼的防线！我们现在无法把德军逐出了！瓦西里耶夫对你的无能极为不满！"
  ],
  "Comrade General you have failed to destroy the Italian Eighth Army! The Germans still threaten to release Sixth Army! Vassiliev is very disatisfied!": [
   "Comrade General you have failed to destroy the Italian Eighth Army! The Germans still threaten to release Sixth Army! Vassiliev is very disatisfied!",
   "将军同志，你未能消灭意大利第8集团军！德国人仍威胁着为第6集团军解围！瓦西里耶夫极为不满！",
   "普罗霍罗夫卡"
  ],
  "Comrade General you have stopped the German offensive. The enemy cannot release the Sixth Army! The Sixth Army is now doomed! The Rodina is safe!": [
   "Comrade General you have stopped the German offensive. The enemy cannot release the Sixth Army! The Sixth Army is now doomed! The Rodina is safe!",
   "将军同志，你已挡住德军的攻势。敌人无法为第6集团军解围！第6集团军现在注定覆灭！祖国安全了！",
   "闪击战"
  ],
  "Comrade General, Comrade Stalin is seriously thinking on you as a candidate for the Commander of the Polish People's Army - at last thanks to your troops' bayonets the Polish Government in Lublin was created.": [
   "Comrade General, Comrade Stalin is seriously thinking on you as a candidate for the Commander of the Polish People's Army - at last thanks to your troops' bayonets the Polish Government in Lublin was created.",
   "将军同志，斯大林同志正认真考虑让你出任波兰人民军司令——多亏你部队的刺刀，卢布林(Lublin)的波兰政府终于建立起来了。",
   "破门而入(Kicking in the door) - 1946 年 4 月 17 日"
  ],
  "Comrade General, in reward of your bravery and devotion Comrade Stalin on Marshal Zhukov's proposal has charged you with the task of assaulting Berlin!!! For your courage you've been again awarded with the Hero of the Soviet Union. Hurrah!!!": [
   "Comrade General, in reward of your bravery and devotion Comrade Stalin on Marshal Zhukov's proposal has charged you with the task of assaulting Berlin!!! For your courage you've been again awarded with the Hero of the Soviet Union. Hurrah!!!",
   "二战 1/2：反击- 挡格",
   "将军同志，为表彰你的勇敢与忠诚，斯大林同志根据朱可夫(Zhukov)元帅的建议，把突击柏林的任务交给了你！！！由于你的英勇，你再次被授予苏联英雄称号。乌拉！！！"
  ],
  "Comrade General: Comrade Stalin is very pleased with your performance!!! Koenigsberg and Danzig have lived, Kaliningrad and Gdansk are born, our borders are now secured for a long time!!!": [
   "Comrade General: Comrade Stalin is very pleased with your performance!!! Koenigsberg and Danzig have lived, Kaliningrad and Gdansk are born, our borders are now secured for a long time!!!",
   "将军同志：斯大林同志对你的表现非常满意！！！柯尼斯堡(Koenigsberg)与但泽(Danzig)已经消亡，加里宁格勒(Kaliningrad)与但泽(Gdansk)就此诞生，我们的边界将长期安全！！！",
   "将军同志：斯大林同志对你的表现非常满意！！！柯尼斯堡(Koenigsberg)与但泽(Danzig)已经消亡，加里宁格勒(Kaliningrad)与格但斯克(Gdansk)就此诞生，我们的边界将长期安全！！！"
  ],
  "Comrade General: This is the opportunity to seize German technology!!!": [
   "Comrade General: This is the opportunity to seize German technology!!!",
   "将军同志：这是夺取德国技术的机会！！！",
   "萨莱诺 - 重返欧洲"
  ],
  "Comrade General: This is your opportunity to expel the German facists from Lithuania and open the road to Germany itself at East Prussia! You will command the First Baltic Front!": [
   "Comrade General: This is your opportunity to expel the German facists from Lithuania and open the road to Germany itself at East Prussia! You will command the First Baltic Front!",
   "南乌克兰集团军群(Army Group Southern Ukraine) (#12) - 1944 年 8 月 7 日",
   "将军同志：这是你把德国法西斯分子逐出立陶宛(Lithuania)、并在东普鲁士打开通往德国本土之路的机会！你将指挥波罗的海第1方面军(First Baltic Front)！"
  ],
  "Congratulations, with your leadership, our troops have erased all British presence here!. The other side of the river is secured, and now we can continue with our journey to Bristol. Good Work again, General.": [
   "Congratulations, with your leadership, our troops have erased all British presence here!. The other side of the river is secured, and now we can continue with our journey to Bristol. Good Work again, General.",
   "恭喜，在你的领导之下，我军已抹去了此地英军的一切存在！河对岸已经确保，现在我们可以继续向布里斯托尔(Bristol)进军了。再次干得好，将军。",
   "萨莱诺 - 重返欧洲"
  ],
