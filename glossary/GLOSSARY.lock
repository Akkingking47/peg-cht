    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "General, the red dream has come true, Stalin is delighted and proud of you, the Red flag floats over the Statue of Liberty and the world is ours thanks to your intervention. The Comunism will rule over the world to the benefit of peasants and workers.",
   "zh": [
    "将军，红色梦想已经成真，斯大林对你又欣喜又骄傲，红旗飘扬在自由女神像(Statue of Liberty)之上，多亏你的出手，世界已归我们所有。共产主义将统治世界，造福农民与工人。",
    "沃尔图诺 (#17v)"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "General, we have a small situation here.",
