  "That was close General, but you pulled it off.": [
   "That was close General, but you pulled it off.",
   "比利时(Belgium) - 1945 年 8 月 10 日",
   "那很险，将军，但你成功了。"
  ],
  "The British offensive has been stopped fortunately. However, we must withdraw our units to safer positions.": [
   "The British offensive has been stopped fortunately. However, we must withdraw our units to safer positions.",
   "卡涅夫",
   "幸好英军的攻势已被挡住。不过，我们必须把部队撤到更安全的位置。"
  ],
  "The Central Committee is very displeased.  Leningrad continues to suffer under enemy bombardment.  You are clearly unfit to lead troops into combat.  Report at once to Ulyanovsk.  A detachment of Red Octobrists are waiting for you to join them.": [
   "The Central Committee is very displeased.  Leningrad continues to suffer under enemy bombardment.  You are clearly unfit to lead troops into combat.  Report at once to Ulyanovsk.  A detachment of Red Octobrists are waiting for you to join them.",
   "中央委员会极为不满。列宁格勒(Leningrad)仍在敌军轰炸下受苦。你显然不适合带兵作战。立即前往乌里扬诺夫斯克(Ulyanovsk)报到。一支红色十月分队正等着你加入。",
   "红色浪潮涌起"
  ],
  "The German army has made significant progress.  Your PanzerKorps must complete an encirclement by capturing Ternopil' from the east.  Of course, in the process, destroy the Soviet forces defending it.": [
   "The German army has made significant progress.  Your PanzerKorps must complete an encirclement by capturing Ternopil' from the east.  Of course, in the process, destroy the Soviet forces defending it.",
   "德军已取得重大进展。你的装甲军必须从东面夺取塔尔诺波尔(Ternopil')，以完成合围。当然，在此过程中还要消灭守御该地的苏军。",
   "德军已取得重大进展。你的装甲军必须从东面夺取捷尔诺波尔(Ternopil')，以完成合围。当然，在此过程中还要消灭守御该地的苏军。"
  ],
