  {
   "en": "By 1945 the Leibstandarte had been successfully moved east by train to Vienna, and the difficult task of rebuilding the division began.  The situation for Germany was critical - Budapest had fallen after a 51 day seige; Warsaw, Lodz and Krakow had fallen; a Soviet Army was in East Prussia; the Red Army was now a mere 200km from Prague, and worst of all, it had crossed the river Oder, and was only 70km from Berlin.  The I SS Panzer Corps was to be used to rectify this critical situation.",
   "zh": [
    "到 1945 年，警卫旗队(Leibstandarte)已通过铁路成功东调至维也纳(Vienna)，重建该师的艰巨任务随之开始。德国的处境十分危急——布达佩斯(Budapest)在被围 51 天后陷落；华沙(Warsaw)、利茨曼施塔特(Lodz)与克拉科夫(Krakow)已经陷落；一支苏军集团军已进入东普鲁士(East Prussia)；红军距布拉格(Prague)仅 200 公里，而最糟的是，它已渡过奥得河(Oder)，距柏林(Berlin)只有 70 公里。党卫军第1装甲军(I SS Panzer Corps)将用来扭转这一危急局面。",
    "到 1945 年，警卫旗队(Leibstandarte)已通过铁路成功东调至维也纳(Vienna)，重建该师的艰巨任务随之开始。德国的处境十分危急——布达佩斯(Budapest)在被围 51 天后陷落；华沙(Warsaw)、罗兹(Lodz)与克拉科夫(Krakow)已经陷落；一支苏军集团军已进入东普鲁士(East Prussia)；红军距布拉格(Prague)仅 200 公里，而最糟的是，它已渡过奥得河(Oder)，距柏林(Berlin)只有 70 公里。党卫军第1装甲军(I SS Panzer Corps)将用来扭转这一危急局面。"
   ],
