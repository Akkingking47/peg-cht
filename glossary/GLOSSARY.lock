   "萨莱诺登陆：重制版"
  ],
  "Iowa": [
   "Iowa",
   "衣阿华号"
  ],
  "It was hoped that you would once again snatch victory from defeat. But it was not to be. The Wehrmacht is a spent force, unable even to slow the Russian Bear.  I advise you to fight your way to the west, Herr General. The Reds are not known for their hospitality to guests.": [
   "It was hoped that you would once again snatch victory from defeat. But it was not to be. The Wehrmacht is a spent force, unable even to slow the Russian Bear.  I advise you to fight your way to the west, Herr General. The Reds are not known for their hospitality to guests.",
   "我们曾指望你再次从失败中夺回胜利。但事与愿违。国防军已成强弩之末，连迟滞俄国熊都做不到。我建议你且战且向西，将军阁下。赤俄向来对来客不甚好客。",
   "梅斯(Metz) - 1945 年 12 月 12 日"
  ],
