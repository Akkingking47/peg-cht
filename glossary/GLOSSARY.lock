  ],
  "You are stupid!, you have destroyed all the operation with your horrible actions!, now it's supposed that we surely would start the evacuation of all the beach-heads before the British could make a counter-attack. A Military Council is already waiting for you in Germany!.": [
   "You are stupid!, you have destroyed all the operation with your horrible actions!, now it's supposed that we surely would start the evacuation of all the beach-heads before the British could make a counter-attack. A Military Council is already waiting for you in Germany!.",
   "你是个蠢货！你这糟糕的行动毁掉了整个作战！现在按说我们肯定得赶在英军反击之前开始撤离所有滩头阵地。一个军事法庭已在德国等着你了！",
   "华沙-波兹南行动 (RTB#30)"
  ],
  "You have disgraced the Allied forces, and on a more specific note, the British Army. You are being sent on a rather long leave. Enjoy your leisure years.": [
   "You have disgraced the Allied forces, and on a more specific note, the British Army. You are being sent on a rather long leave. Enjoy your leisure years.",
   "你让盟军蒙羞，更具体地说，是英国陆军。你被送去度一个相当长的假期。好好享受你的闲居岁月吧。",
   "敦刻尔克"
  ],
  "You have failed miserably.  Rommel remains dominant in North Africa and Egypt is now sure to fall. Report for reassignment immediately!": [
   "You have failed miserably.  Rommel remains dominant in North Africa and Egypt is now sure to fall. Report for reassignment immediately!",
   "你败得很惨。隆美尔(Rommel)仍主宰着北非(North Africa)，埃及(Egypt)如今必定陷落。立即报到接受改派！",
   "渡过沃尔图诺河"
  ],
  "You were fortunate to have escaped capture after the fiasco you perpetrated in Finland.  However, your previous performance merits another opportunity.  Do not fail us again.": [
   "You were fortunate to have escaped capture after the fiasco you perpetrated in Finland.  However, your previous performance merits another opportunity.  Do not fail us again.",
   "你在芬兰酿成惨败后还能逃脱被俘，算你走运。不过，你以往的表现值得再给一次机会。别再让我们失望了。",
   "喀尔巴阡山脉(Carpathian Mountains) (#13) - 1944 年 10 月 11 日"
  ],
  "Your efforts have been very meritorious, but the Americans have broken the line in El Guettar, so we don't have another choice: the retreat.": [
   "Your efforts have been very meritorious, but the Americans have broken the line in El Guettar, so we don't have another choice: the retreat.",
   "你的努力十分可嘉，但美军已在盖塔尔(El Guettar)突破防线，我们别无选择：撤退。",
   "西迪布济德"
