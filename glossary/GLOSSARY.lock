   ],
   "cls": "已登记"
  },
  {
   "en": "That was close General, but you pulled it off.",
   "zh": [
    "比利时(Belgium) - 1945 年 8 月 10 日",
    "那很险，将军，但你成功了。"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "The British offensive has been stopped fortunately. However, we must withdraw our units to safer positions.",
   "zh": [
    "卡涅夫",
    "幸好英军的攻势已被挡住。不过，我们必须把部队撤到更安全的位置。"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "The Central Committee is very displeased.  Leningrad continues to suffer under enemy bombardment.  You are clearly unfit to lead troops into combat.  Report at once to Ulyanovsk.  A detachment of Red Octobrists are waiting for you to join them.",
   "zh": [
    "中央委员会极为不满。列宁格勒(Leningrad)仍在敌军轰炸下受苦。你显然不适合带兵作战。立即前往乌里扬诺夫斯克(Ulyanovsk)报到。一支红色十月分队正等着你加入。",
    "红色浪潮涌起"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "The German army has made significant progress.  Your PanzerKorps must complete an encirclement by capturing Ternopil' from the east.  Of course, in the process, destroy the Soviet forces defending it.",
   "zh": [
    "德军已取得重大进展。你的装甲军必须从东面夺取塔尔诺波尔(Ternopil')，以完成合围。当然，在此过程中还要消灭守御该地的苏军。",
    "德军已取得重大进展。你的装甲军必须从东面夺取捷尔诺波尔(Ternopil')，以完成合围。当然，在此过程中还要消灭守御该地的苏军。"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "The Sarin gas facility is down.  Although you accomplished your objectives,",
   "zh": [
    "巴巴罗萨行动(Unternehmen Barbarossa)",
    "沙林毒气设施已瘫痪。尽管你达成了目标，"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Thermopylae: Redux",
   "zh": [
    "北非-14 温泉关：重制版",
    "温泉关：重制版"
   ],
   "layers": [
    "COMMON"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "These Poles are madmen!",
   "zh": [
    "POW 营地",
    "这些波兰人是疯子！"
   ],
   "layers": [
    "COMMON"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "This is absolutely unacceptable. Now all we have to do is wait for the first missiles to crash down upon western Europe...",
   "zh": [
    "北风行动",
    "这绝对不可接受。现在我们能做的只是等待第一批导弹砸向西欧……"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "This is the end, try to escape anywhere while you can, before the allies turns you into a prisoner of war.",
   "zh": [
    "维亚济马",
    "这是结局，趁还能跑就赶紧逃吧，别等盟军把你变成战俘。"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Though our attack was well timed and resulted in complete surprise of the enemy, your performance was not of the highest caliber, Herr General.  Although you were successful, we expected more from you.",
   "zh": [
    "尽管我们的进攻时机得当、达成了对敌的完全突然性，但你的表现并非上乘，将军阁下。你虽然成功了，我们对你的期望却更高。",
    "苏伊士(Suez)："
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Tobruk PeG:WW2",
   "zh": [
    "北非-15 托布鲁克 PeG:WW2",
    "托布鲁克 PeG:WW2"
   ],
   "layers": [
    "COMMON"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
