  "Superb work, Herr General!  Thanks to your rapid advance across the Meuse, the Allies are in complete disarray.  You have demonstrated the superiority of our tactics over what was once called the world's best army.  We must now push rapidly to the shores of the English Channel and complete the defeat of our enemies.": [
   "Superb work, Herr General!  Thanks to your rapid advance across the Meuse, the Allies are in complete disarray.  You have demonstrated the superiority of our tactics over what was once called the world's best army.  We must now push rapidly to the shores of the English Channel and complete the defeat of our enemies.",
   "古斯塔夫防线，1944 年 1 月 17 日",
   "干得漂亮，将军阁下！多亏你迅速渡过默兹河，盟军已彻底陷入混乱。你证明了我们的战术优于那支曾号称世界最强的军队。我们现在必须迅速推进到英吉利海峡岸边，完成对敌人的击败。"
  ],
