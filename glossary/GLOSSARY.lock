  ],
  "General, our advance along the railroad is going nicely.": [
   "General, our advance along the railroad is going nicely.",
   "将军，我们沿铁路的推进进展顺利。",
   "诺夫哥罗德"
  ],
  "General, the fighting was hard, but London is ours, Churchill has escaped to the north, now no one can deny the victory of the Third Reich!!": [
   "General, the fighting was hard, but London is ours, Churchill has escaped to the north, now no one can deny the victory of the Third Reich!!",
   "圣洛(St. Lo) - 向圣洛推进",
   "将军，战斗很艰苦，但伦敦(London)是我们的了，丘吉尔(Churchill)已逃往北方，现在没有人能否认第三帝国的胜利了！！"
  ],
  "General, the red dream has come true, Stalin is delighted and proud of you, the Red flag floats over the Statue of Liberty and the world is ours thanks to your intervention. The Comunism will rule over the world to the benefit of peasants and workers.": [
   "General, the red dream has come true, Stalin is delighted and proud of you, the Red flag floats over the Statue of Liberty and the world is ours thanks to your intervention. The Comunism will rule over the world to the benefit of peasants and workers.",
   "将军，红色梦想已经成真，斯大林对你又欣喜又骄傲，红旗飘扬在自由女神像(Statue of Liberty)之上，多亏你的出手，世界已归我们所有。共产主义将统治世界，造福农民与工人。",
   "沃尔图诺 (#17v)"
  ],
  "General, we have a small situation here.": [
   "General, we have a small situation here.",
   "卡拉奇 (#1)",
   "将军，我们这里出了点小状况。"
  ],
  "Giovanni Di Verazza": [
   "Giovanni Di Verazza",
   "乔瓦尼·达韦拉扎诺号"
  ],
  "Good job Commander. You managed to hold the line and even send those Reds back a few miles.": [
   "Good job Commander. You managed to hold the line and even send those Reds back a few miles.",
   "干得好，指挥官。你设法守住了防线，甚至把那些赤色分子打退了几英里。",
   "彼得库夫(Piotrkow) - 1939 年 9 月 7 日"
  ],
  "Good job, Commander. The attack into the Soviet homeland continues...": [
   "Good job, Commander. The attack into the Soviet homeland continues...",
   "干得好，指挥官。向苏联本土的进攻仍在继续……",
   "龙骑兵行动(Opération Dragoon)"
  ],
  "Good luck!": [
   "Good luck!",
   "祝你好运！",
   "祝好运！"
  ],
  "Good morning, general, You've made quite wise decision turning to our side. The Reich appreciates your courage. You and your soldiers can now fight alongside us against communism. Although it is a hard time, we believe the Führer will find the right solution.": [
   "Good morning, general, You've made quite wise decision turning to our side. The Reich appreciates your courage. You and your soldiers can now fight alongside us against communism. Although it is a hard time, we believe the Führer will find the right solution.",
   "奥克岭",
   "早上好，将军，你投向我们这边是个相当明智的决定。帝国(Reich)赞赏你的勇气。你和你的士兵现在可以与我们并肩对抗共产主义。虽说时局艰难，但我们相信元首会找到正确的解决办法。"
  ],
  "Great Job, Moscow is now back to normal and Comrade Stalin is safe thanks to your intervention.": [
   "Great Job, Moscow is now back to normal and Comrade Stalin is safe thanks to your intervention.",
   "干得漂亮，莫斯科(Moscow)现已恢复正常，多亏你的出手，斯大林同志安然无恙。",
   "库尔斯克 (#16v)"
  ],
  "Great job Commander. Although Greece has fallen, those submarines have been destroyed along with a substantial portion of the garrison force in Greece.": [
   "Great job Commander. Although Greece has fallen, those submarines have been destroyed along with a substantial portion of the garrison force in Greece.",
   "干得漂亮，指挥官。虽然希腊已经陷落，但那些潜艇以及希腊驻军的一大部分都已被消灭。",
   "行军命令"
  ],
  "Great job, Commander! The missiles are neutralized, and we push towards Moscow! Let's hope Stalin doesn't have any more secret weapons...": [
   "Great job, Commander! The missiles are neutralized, and we push towards Moscow! Let's hope Stalin doesn't have any more secret weapons...",
   "塞瓦斯托波尔(Sevastopol) (#5) - 1942 年 6 月 7 日",
   "干得漂亮，指挥官！导弹已被摧毁，我们向莫斯科推进！希望斯大林没有更多秘密武器了……"
  ],
  "Great work!, we have eliminated the allied menace on the Mediterranean, greek partisans have established a proper socialist goverment in their country.": [
   "Great work!, we have eliminated the allied menace on the Mediterranean, greek partisans have established a proper socialist goverment in their country.",
   "干得漂亮！我们已消除地中海的盟军威胁，希腊游击队已在他们国家建立了像样的社会主义政府。",
   "波兰'45 - 1945 年 11 月 2 日"
  ],
  "HMS B/Carpathian Rifle Brigade/ Polish": [
   "HMS B/Carpathian Rifle Brigade/ Polish",
   "HMS B/喀尔巴阡步枪旅/ 波兰",
   "HMS B/喀尔巴阡步枪旅/波兰"
  ],
  "Herr General you dealt a mighty blow to the Russians.  We will have a quiet Southern front for a long time.": [
   "Herr General you dealt a mighty blow to the Russians.  We will have a quiet Southern front for a long time.",
   "刻赤(Kerch) - 1943年8月11日",
   "将军阁下，你给了俄国人一记沉重的打击。南线将长久平静了。"
  ],
  "Herr General, I am sorry that the sacrifice of your fine troops have been in vain.  You have been ordered to Berlin.  I do not envy your reception there.": [
   "Herr General, I am sorry that the sacrifice of your fine troops have been in vain.  You have been ordered to Berlin.  I do not envy your reception there.",
   "将军阁下，我很遗憾，你精锐部队的牺牲都白费了。你已被命令前往柏林。你在那里将受到的接待，我可一点也不羡慕。",
   "郊区！"
  ],
  "Herr General, Kishinev is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise.  Soon, you will be needed at Army Group North. I am sure that you will do very well.": [
   "Herr General, Kishinev is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise.  Soon, you will be needed at Army Group North. I am sure that you will do very well.",
   "将军阁下，基什尼奥夫已确保。德罗部队正在占领乌克兰。这场胜利值得大力褒奖。不久你将需前往北方集团军群。我相信你定会表现优异。",
   "将军阁下，基希讷乌已确保。德罗部队正在占领乌克兰。这场胜利值得大力褒奖。不久你将需前往北方集团军群。我相信你定会表现优异。"
  ],
  "Herr General, Kishinev is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise. Soon, you will be needed at Army Group North.": [
   "Herr General, Kishinev is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise. Soon, you will be needed at Army Group North.",
   "将军阁下，基什尼奥夫已确保。德罗部队正在占领乌克兰。这场胜利值得大力褒奖。不久你将需前往北方集团军群。",
   "将军阁下，基希讷乌已确保。德罗部队正在占领乌克兰。这场胜利值得大力褒奖。不久你将需前往北方集团军群。"
  ],
  "Herr General, Ternopil' is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise. Soon, you will be needed at Army Group North.": [
   "Herr General, Ternopil' is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise. Soon, you will be needed at Army Group North.",
   "将军阁下，塔尔诺波尔(Ternopil')已确保无虞。德军与罗马尼亚军队正在占领乌克兰。这一胜利值得大加赞扬。很快，北方集团军群(Army Group North)就需要你。",
   "将军阁下，捷尔诺波尔(Ternopil')已确保无虞。德军与罗马尼亚军队正在占领乌克兰。这一胜利值得大加赞扬。很快，北方集团军群(Army Group North)就需要你。"
  ],
  "Herr General, Your great victory have forced the French to sue for peace! Congratulations!!": [
   "Herr General, Your great victory have forced the French to sue for peace! Congratulations!!",
   "将军阁下，你的重大胜利迫使法国人求和！恭喜！！",
   "斯摩棱斯克(Smolensk)-强渡第聂伯河(Dniepr) - 1941 年 7 月 7 日"
  ],
  "Herr General, the enemy fought valiantly, but this did not stop you.  And now, the last Bolshevik reserves await our attack.  Your presence is requested else where leave this rabble to us and we'll end this war.": [
   "Herr General, the enemy fought valiantly, but this did not stop you.  And now, the last Bolshevik reserves await our attack.  Your presence is requested else where leave this rabble to us and we'll end this war.",
   "将军阁下，敌人打得英勇，但这并没有挡住你。而现在，布尔什维克最后的预备队正等着我们去进攻。别处需要你去——把这群乌合之众交给我们，我们会结束这场战争。",
   "逼近突尼斯"
  ],
  "Herr General, your narrow victory has shown that already you have gained some experience in this new type of warfare.  In addition, the new pro-German government in Spain may prove to be a useful ally in the coming years.": [
   "Herr General, your narrow victory has shown that already you have gained some experience in this new type of warfare.  In addition, the new pro-German government in Spain may prove to be a useful ally in the coming years.",
   "埃布罗",
   "将军阁下，你的险胜表明，你已在这种新型战争中积累了一些经验。此外，西班牙新成立的亲德政府或许会在未来岁月中成为有用的盟友。"
  ],
  "Herr General, your thrust to Strasbourg will be used as a textbook example of offensive maneuver. This lightning blow, you have changed the course of the war in the west. Outstanding.": [
   "Herr General, your thrust to Strasbourg will be used as a textbook example of offensive maneuver. This lightning blow, you have changed the course of the war in the west. Outstanding.",
   "将军阁下，你向斯特拉斯堡的突击将被用作进攻机动的教科书范例。这一闪电般的打击，你改变了西线的战争进程。卓越。",
   "马耳他(Malta)："
  ],
  "Hipper": [
   "Hipper",
   "希佩尔海军上将号"
  ],
  "Humph....  Herr General, you did manage to defeat the Poles, but you are behind schedule.  Your forces are no longer in the vanguard of our assault.  This will not do.": [
   "Humph....  Herr General, you did manage to defeat the Poles, but you are behind schedule.  Your forces are no longer in the vanguard of our assault.  This will not do.",
   "哼……将军阁下，你确实击败了波兰人，但进度落后了。你的部队已不再是我们进攻的先锋。这可不行。",
   "奥博扬"
  ],
