  {
   "en": "General, the fighting was hard, but London is ours, Churchill has escaped to the north, now no one can deny the victory of the Third Reich!!",
   "zh": [
    "圣洛(St. Lo) - 向圣洛推进",
    "将军，战斗很艰苦，但伦敦(London)是我们的了，丘吉尔(Churchill)已逃往北方，现在没有人能否认第三帝国的胜利了！！"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
