   "北风行动",
   "这绝对不可接受。现在我们能做的只是等待第一批导弹砸向西欧……"
  ],
  "This is the end, try to escape anywhere while you can, before the allies turns you into a prisoner of war.": [
   "This is the end, try to escape anywhere while you can, before the allies turns you into a prisoner of war.",
   "维亚济马",
   "这是结局，趁还能跑就赶紧逃吧，别等盟军把你变成战俘。"
  ],
  "Though our attack was well timed and resulted in complete surprise of the enemy, your performance was not of the highest caliber, Herr General.  Although you were successful, we expected more from you.": [
   "Though our attack was well timed and resulted in complete surprise of the enemy, your performance was not of the highest caliber, Herr General.  Although you were successful, we expected more from you.",
   "尽管我们的进攻时机得当、达成了对敌的完全突然性，但你的表现并非上乘，将军阁下。你虽然成功了，我们对你的期望却更高。",
