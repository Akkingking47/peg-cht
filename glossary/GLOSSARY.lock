  "Victory!!!, the British have been kicked from another place more!. Now, the Mediterranean is closed, and the South Bank is secured. Of course, we will put a permanent garrison in Spain, surely this won't please to Franco, but... this is not important! HAHAHAHAHA!": [
   "Victory!!!, the British have been kicked from another place more!. Now, the Mediterranean is closed, and the South Bank is secured. Of course, we will put a permanent garrison in Spain, surely this won't please to Franco, but... this is not important! HAHAHAHAHA!",
   "波美拉尼亚壁垒(Wal Pomorski) -「波美拉尼亚阵地」(Pommernstellung)",
   "胜利！！！英国人又被我们从一个地方踢了出去！现在，地中海已经封闭，南岸也已确保。当然，我们会在西班牙驻一支永久守备部队，这肯定不讨佛朗哥(Franco)喜欢，但……这不重要！哈哈哈哈哈！"
  ],
  "Viipuri": [
   "Viipuri",
