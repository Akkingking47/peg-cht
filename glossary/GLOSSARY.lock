  "Volokolamsk PeG:WW2": [
   "Volokolamsk PeG:WW2",
   "东线-27 沃洛科拉姆斯克 PeG:WW2",
   "沃洛科拉姆斯克 PeG:WW2"
  ],
  "Volokolamsk: Redux": [
   "Volokolamsk: Redux",
   "东线-28 沃洛科拉姆斯克：重制版",
   "沃洛科拉姆斯克：重制版"
  ],
  "We really needed a knockout blow here, Commander.  Instead, you put up a weak little jab.  Our boys are fighters, but we need a general who can lead them!  Son, I put a lot of faith in your abilities... I was wrong, Commander.  It's time to send you back home.": [
   "We really needed a knockout blow here, Commander.  Instead, you put up a weak little jab.  Our boys are fighters, but we need a general who can lead them!  Son, I put a lot of faith in your abilities... I was wrong, Commander.  It's time to send you back home.",
   "从莱姆里吉斯(Lyme Regis)到温莎(Windsor)：",
   "我们这里真正需要的是一记击倒对手的重拳，指挥官。可你却打出一记软弱无力的小刺拳。我们的小伙子都是战士，但我们需要一位能带领他们的将军！孩子，我曾对你的能力寄予厚望……我错了，指挥官。该送你回家了。"
  ],
  "Welcome to Sevilla, General.": [
   "Welcome to Sevilla, General.",
   "北非-17 欢迎来到塞维利亚(Sevilla)，将军。",
   "欢迎来到塞维利亚(Sevilla)，将军。"
  ],
  "Well Comrade, most of the fascist invaders are trapped.  At least, you accomplished your mission.  Now, you must prepare yourself for further operations.": [
   "Well Comrade, most of the fascist invaders are trapped.  At least, you accomplished your mission.  Now, you must prepare yourself for further operations.",
   "好吧，同志，大部分法西斯入侵者已被困住。至少你完成了任务。现在，你必须为后续作战做好准备。",
   "波兰 1945"
  ],
  "Well done Comrade, you've got the control of Metz, Comrade Stalin is glad with your work.": [
   "Well done Comrade, you've got the control of Metz, Comrade Stalin is glad with your work.",
   "干得好，同志，你已经控制了梅斯，斯大林同志对你的工作很满意。",
   "白色方案(Fall Weiss) - 1939 年 9 月 1 日"
  ],
  "Well that was a nasty surprise!  You survived that counterattack but we must move quickly now against Dunkirk.": [
   "Well that was a nasty surprise!  You survived that counterattack but we must move quickly now against Dunkirk.",
   "维斯瓦河",
   "这可真是个讨厌的意外！你顶住了那次反击，但我们现在必须迅速行动，对付敦刻尔克(Dunkirk)。"
  ],
  "Well, The General Staff is pleased by your performance.  Egypt and the Middle East lie at our feet.  Your ability on the battlefield continues to confound our enemies.": [
   "Well, The General Staff is pleased by your performance.  Egypt and the Middle East lie at our feet.  Your ability on the battlefield continues to confound our enemies.",
   "好，总参谋部对你的表现感到满意。埃及和中东已匍匐在我们脚下。你在战场上的能力持续令敌人困惑。",
   "芬兰人完蛋了？"
  ],
  "Well, the British resistance had been really strong again, but finally we have achieved victory. However, you need a little improvement of your tactics, or maybe the British would kick us from Great Britain.": [
   "Well, the British resistance had been really strong again, but finally we have achieved victory. However, you need a little improvement of your tactics, or maybe the British would kick us from Great Britain.",
   "嗯，英军的抵抗又一次十分顽强，但我们终于取得了胜利。不过，你的战术还需要一点改进，否则英国人说不定会把我们踢出不列颠。",
   "破门而入"
  ],
