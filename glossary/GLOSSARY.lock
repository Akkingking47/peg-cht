   "cls": "已登记"
  },
  {
   "en": "Herr General, Ternopil' is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise. Soon, you will be needed at Army Group North.",
   "zh": [
    "将军阁下，塔尔诺波尔(Ternopil')已确保无虞。德军与罗马尼亚军队正在占领乌克兰。这一胜利值得大加赞扬。很快，北方集团军群(Army Group North)就需要你。",
    "将军阁下，捷尔诺波尔(Ternopil')已确保无虞。德军与罗马尼亚军队正在占领乌克兰。这一胜利值得大加赞扬。很快，北方集团军群(Army Group North)就需要你。"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Herr General, Your great victory have forced the French to sue for peace! Congratulations!!",
   "zh": [
    "将军阁下，你的重大胜利迫使法国人求和！恭喜！！",
    "斯摩棱斯克(Smolensk)-强渡第聂伯河(Dniepr) - 1941 年 7 月 7 日"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Herr General, the enemy fought valiantly, but this did not stop you.  And now, the last Bolshevik reserves await our attack.  Your presence is requested else where leave this rabble to us and we'll end this war.",
   "zh": [
    "将军阁下，敌人打得英勇，但这并没有挡住你。而现在，布尔什维克最后的预备队正等着我们去进攻。别处需要你去——把这群乌合之众交给我们，我们会结束这场战争。",
    "逼近突尼斯"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Herr General, we have underestimated the Bolsheviks' powers of resistance. They have crossed the Don and completely encircled Sixth Army. You must drive on Kletskaya and Serafimov to reestablish contact. We will never, never surrender to the Red Army, but in order for us to hold our position, you must prevail. Good Luck.",
   "zh": [
    "将军阁下，我们低估了布尔什维克的抵抗能力。他们已渡过顿河，彻底包围了第6集团军。你必须向克列茨卡亚和谢拉菲莫维奇推进，以恢复联系。我们绝不会，绝不会向红军投降，但为了守住阵地，你必须取胜。祝好运。",
    "将军阁下，我们低估了布尔什维克的抵抗能力。他们已渡过顿河，彻底包围了第六集团军。你必须向克列茨卡亚和谢拉菲莫维奇推进，以恢复联系。我们绝不会，绝不会向红军投降，但为了守住阵地，你必须取胜。祝好运。"
   ],
   "layers": [
    "COMMON",
    "SCOPE"
   ],
   "scopes": [
    "EFILE_OLGWW2",
    "PEGWW2_SCN"
   ],
   "cls": "已登记"
  },
  {
   "en": "Herr General, your narrow victory has shown that already you have gained some experience in this new type of warfare.  In addition, the new pro-German government in Spain may prove to be a useful ally in the coming years.",
   "zh": [
    "埃布罗",
    "将军阁下，你的险胜表明，你已在这种新型战争中积累了一些经验。此外，西班牙新成立的亲德政府或许会在未来岁月中成为有用的盟友。"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Herr General, your thrust to Strasbourg will be used as a textbook example of offensive maneuver. This lightning blow, you have changed the course of the war in the west. Outstanding.",
   "zh": [
    "将军阁下，你向斯特拉斯堡的突击将被用作进攻机动的教科书范例。这一闪电般的打击，你改变了西线的战争进程。卓越。",
    "马耳他(Malta)："
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
