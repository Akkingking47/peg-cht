  {
   "en": "Herr General you dealt a mighty blow to the Russians.  We will have a quiet Southern front for a long time.",
   "zh": [
    "刻赤(Kerch) - 1943年8月11日",
    "将军阁下，你给了俄国人一记沉重的打击。南线将长久平静了。"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Herr General, I am sorry that the sacrifice of your fine troops have been in vain.  You have been ordered to Berlin.  I do not envy your reception there.",
   "zh": [
    "将军阁下，我很遗憾，你精锐部队的牺牲都白费了。你已被命令前往柏林。你在那里将受到的接待，我可一点也不羡慕。",
    "郊区！"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Herr General, Kishinev is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise.  Soon, you will be needed at Army Group North. I am sure that you will do very well.",
   "zh": [
    "将军阁下，基什尼奥夫已确保。德罗部队正在占领乌克兰。这场胜利值得大力褒奖。不久你将需前往北方集团军群。我相信你定会表现优异。",
    "将军阁下，基希讷乌已确保。德罗部队正在占领乌克兰。这场胜利值得大力褒奖。不久你将需前往北方集团军群。我相信你定会表现优异。"
   ],
   "layers": [
    "SCOPE"
   ],
   "scopes": [
    "PEGWW2_SCN",
    "PEGWW2_SCN_OVR"
   ],
   "cls": "已登记"
  },
  {
   "en": "Herr General, Kishinev is secure. German and Romanian troops are occupying the Ukraine.  This victory is worthy of great praise. Soon, you will be needed at Army Group North.",
   "zh": [
    "将军阁下，基什尼奥夫已确保。德罗部队正在占领乌克兰。这场胜利值得大力褒奖。不久你将需前往北方集团军群。",
    "将军阁下，基希讷乌已确保。德罗部队正在占领乌克兰。这场胜利值得大力褒奖。不久你将需前往北方集团军群。"
   ],
